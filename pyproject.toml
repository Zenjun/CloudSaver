[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsaver"
version = "0.1.0"
description = "Explainable AWS cost optimization candidates, starting with an offline demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cloudsaver = "cloudsaver.cli:main"

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "boto3>=1.34,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudsaver = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cloudsaver"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
